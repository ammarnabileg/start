<style><![CDATA[
#ai-team-artwork{font-family:system-ui,'Segoe UI',sans-serif;overflow:visible;}
.network-route .route-highlight{opacity:0;fill:none;stroke:var(--agent-color);stroke-width:2.35;stroke-linecap:round;filter:url(#signal-glow);transition:opacity .16s ease, stroke-width .18s ease;stroke-dasharray:10 11;}
.network-route.route-lit .route-highlight{opacity:.42;animation:routeFlow 1.05s linear infinite;}
.network-route.route-busy .route-highlight{opacity:.68;stroke-width:2.9;}
.network-route .agent-activity{transition:opacity .22s ease, transform .22s ease;transform-origin:center center;}
.network-route.is-working .agent-activity{opacity:.48;animation:agentPulse .82s ease-in-out infinite alternate;}
#central-pulse{opacity:0;transform-origin:1024px 538px;transition:opacity .12s;}
#ai-team-artwork.core-receiving #central-pulse{opacity:.92;animation:coreBreathe .36s ease-in-out 3 alternate;}
#ai-team-artwork.core-dispatching #central-pulse{opacity:1;animation:coreBroadcast .9s ease-in-out infinite;}
@keyframes coreBreathe{from{transform:scale(.92);opacity:.36;}to{transform:scale(1.12);opacity:.9;}}
@keyframes coreBroadcast{0%{transform:scale(.98);opacity:.46;}50%{transform:scale(1.18);opacity:1;}100%{transform:scale(1.04);opacity:.7;}}
@keyframes routeFlow{to{stroke-dashoffset:-42;}}
@keyframes agentPulse{from{opacity:.22;transform:scale(.985);}to{opacity:.56;transform:scale(1.02);}}
.agent-hit{cursor:pointer;outline:none;}
.agent-hit:focus-visible{stroke:#67E8F9;stroke-width:2.5;stroke-dasharray:6 6;}
@media (prefers-reduced-motion:reduce){.route-highlight,.agent-activity{transition:none;animation:none;}#ai-team-artwork.core-receiving #central-pulse,#ai-team-artwork.core-dispatching #central-pulse{animation:none;}}
]]></style>

  var cycleTimer = null, runToken = 0, transientTimers = [], autoEnabled = false;
  var selected = [];
  var notify = function(msg,roles){
     try { svg.dispatchEvent(new CustomEvent('agent-network-status', {bubbles:true,detail:{message:msg,roles:roles||[],selected:selected.slice(),auto:autoEnabled}})); }catch(e){}
  };
  function after(ms, fn){ var id = window.setTimeout(fn, ms); transientTimers.push(id); return id; }
  function uniqRoles(list){
    var out=[]; (list||[]).forEach(function(r){ if(ids.indexOf(r)>=0 && out.indexOf(r)<0) out.push(r); });
    return out;
  }
  function clearTasks(){
    runToken++;
    transientTimers.forEach(function(t){ clearTimeout(t); }); transientTimers=[];
    svg.querySelectorAll('animate, animateMotion').forEach(function(el){ if(el.endElement){ try{el.endElement();}catch(e){} } });
    svg.querySelectorAll('.network-route').forEach(function(el){ el.classList.remove('route-lit','route-busy','is-working'); });
    svg.classList.remove('core-receiving','core-dispatching');
  }
  function begin(id, stage){
    ['motion-'+stage+'-'+id, 'fade-'+stage+'-'+id,'motion-'+stage+'-halo-'+id,'fade-'+stage+'-halo-'+id].forEach(function(key){
      var el=document.getElementById(key); if(el && el.beginElement) el.beginElement();
    });
  }
  function pulseTrain(id, stage, count, gap, offset){
    offset = offset || 0;
    for(var i=0;i<count;i++){
      (function(delay){ after(delay, function(){ begin(id, stage); }); })(offset + (i*gap));
    }
  }
  function activateRoute(id, busy){
    var el = svg.querySelector('#route-'+id);
    if(!el) return;
    el.classList.add('route-lit','is-working');
    if(busy) el.classList.add('route-busy');
  }
  function runRoles(roles){
    roles = uniqRoles(roles);
    if(!roles.length){ clearTasks(); selected=[]; notify('متوقف',[]); return; }
    clearTasks();
    selected = roles.slice();
    var current = runToken;
    var targets = ids.filter(function(id){ return roles.indexOf(id) === -1; });
    if(!targets.length) targets = ids.slice();

    roles.forEach(function(role, idx){
      activateRoute(role, true);
      pulseTrain(role, 'in', 3, 170, idx*120);
    });
    notify('إرسال الإشارة من ' + roles.length + ' وكيل إلى النظام المركزي', roles.slice());

    after(980 + roles.length*80, function(){
      if(runToken!==current) return;
      svg.classList.add('core-receiving');
      notify('النظام المركزي يستقبل ويعالج ' + roles.length + ' تدفقات', roles.slice());
    });

    after(1460 + roles.length*90, function(){
      if(runToken!==current) return;
      svg.classList.remove('core-receiving');
      svg.classList.add('core-dispatching');
      notify('النظام يوزّع الإشارة إلى ' + targets.length + ' وكلاء', roles.slice());
      targets.forEach(function(id, idx){
        after(idx*90, function(){
          if(runToken!==current) return;
          activateRoute(id, true);
          pulseTrain(id, 'out', 2, 180, 0);
        });
      });
    });

    after(4200 + roles.length*70, function(){
      if(runToken!==current) return;
      svg.classList.remove('core-receiving','core-dispatching');
      svg.querySelectorAll('.network-route').forEach(function(el){ el.classList.remove('route-lit','route-busy','is-working'); });
      notify('اكتمل انتقال الإشارات', roles.slice());
    });
  }
  function stop(){
    if(cycleTimer) clearInterval(cycleTimer);
    cycleTimer = null; autoEnabled = false;
    clearTasks(); selected=[]; notify('متوقف',[]);
  }
  function start(){
    stop(); autoEnabled = true;
    function randomGroup(){
      var copy = ids.slice().sort(function(){ return Math.random() - 0.5; });
      var size = 2 + Math.floor(Math.random()*3); // 2..4 agents at once
      return copy.slice(0,size);
    }
    var first = randomGroup();
    runRoles(first);
    cycleTimer = setInterval(function(){ runRoles(randomGroup()); }, 5200);
    notify('العرض التلقائي يعمل بعدة وكلاء معًا', first.slice());
  }
  function cycle(role){ autoEnabled = false; if(cycleTimer) clearInterval(cycleTimer); cycleTimer = null; runRoles([role]); }
  function cycleMany(roles){ autoEnabled = false; if(cycleTimer) clearInterval(cycleTimer); cycleTimer = null; runRoles(roles); }
  function toggle(role){
    autoEnabled = false; if(cycleTimer) clearInterval(cycleTimer); cycleTimer = null;
    var next = selected.slice();
    var idx = next.indexOf(role);
    if(idx >= 0) next.splice(idx,1); else next.push(role);
    runRoles(next);
  }
  svg.querySelectorAll('.agent-hit').forEach(function(hit){
    function pick(){ toggle(hit.getAttribute('data-role')); }
    hit.addEventListener('click', pick);
    hit.addEventListener('keydown', function(e){ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); pick(); } });
  });
  window.aiTeamNetwork = {
    cycle: cycle,
    cycleMany: cycleMany,
    toggle: toggle,
    start: start,
    stop: stop,
    ids: ids,
    isAuto: function(){ return autoEnabled; },
    getSelected: function(){ return selected.slice(); }
  };
  /* live-driven: autostart disabled */
})();
]]></script>
</svg></section>
